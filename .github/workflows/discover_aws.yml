name: Discover AWS Network IDs

on:
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  discover:
    name: Get Network Info
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Get Subnet IDs
        run: |
          echo "🔎 FETCHING YOUR SUBNET IDs..."
          aws ec2 describe-subnets --query "Subnets[*].{ID:SubnetId,AZ:AvailabilityZone,CIDR:CidrBlock}" --output table

      - name: Get Security Group IDs
        run: |
          echo "🛡️ FETCHING YOUR SECURITY GROUP IDs..."
          aws ec2 describe-security-groups --query "SecurityGroups[*].{Name:GroupName,ID:GroupId,Description:Description}" --output table

      - name: Check Port 1337 (Strapi Port)
        run: |
          echo "🚦 CHECKING IF PORT 1337 IS OPEN..."
          aws ec2 describe-security-groups --filters Name=ip-permission.from-port,Values=1337 --query "SecurityGroups[*].{Name:GroupName,ID:GroupId}" --output table